<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ЛогоЗверята</title>
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">🦊</span>
        <span>
          <b>ЛогоЗверята</b>
          <small>говорим играя</small>
        </span>
      </div>
      <button class="chip" id="nameChip">👶 Настроить</button>
    </header>

    <section class="screen active" id="scr-home"></section>
    <section class="screen" id="scr-sounds"></section>
    <section class="screen" id="scr-sound"></section>
    <section class="screen" id="scr-artic"></section>
    <section class="screen" id="scr-play"></section>
    <section class="screen" id="scr-progress"></section>
  </div>

  <nav class="nav" id="nav">
    <button data-nav="home"><span class="i">🏠</span>Главная</button>
    <button data-nav="sounds"><span class="i">🔊</span>Звуки</button>
    <button data-nav="artic"><span class="i">😝</span>Гимнастика</button>
    <button data-nav="play"><span class="i">🦆</span>Играем</button>
    <button data-nav="progress"><span class="i">⭐</span>Рост</button>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
